[project]
name = "domain-expert-factory"
version = "0.1.0"
description = "Turn domain documents into a small, fast, quantised expert model: teacher distillation, guarded LoRA fine-tuning and edge-ready quantisation."
readme = "README.md"
requires-python = ">=3.10,<3.14"
authors = [{ name = "mohi2006august" }]
keywords = ["llm", "fine-tuning", "lora", "distillation", "quantization", "overfitting"]
dependencies = [
    "anthropic>=1.12,<2",
    "dagster>=1.13,<1.14",
    "dagster-webserver>=1.13,<1.14",
    "fastapi>=0.140",
    "jinja2>=3.1",
    "numpy>=2.0",
    "pydantic>=2.10",
    "python-multipart>=0.0.20",
    "pyyaml>=6.0",
    "rich>=13.9",
    "structlog>=25.1",
    "typer>=0.15",
    "uvicorn>=0.34",
]

[project.optional-dependencies]
# Real student training: TRL + PEFT (LoRA / QLoRA). Install with `uv sync --extra train`.
train = [
    "torch>=2.6",
    "transformers>=4.56",
    "peft>=0.17",
    "trl>=1.0",
    "accelerate>=1.10",
    "datasets>=4.0",
    "bitsandbytes>=0.47; sys_platform != 'darwin'",
]
# AWQ int4 for GPU serving (vLLM). llm-compressor is the maintained successor of AutoAWQ.
awq = ["llmcompressor>=0.8"]
# GGUF evaluation on CPU / edge (conversion uses a llama.cpp checkout, see TECHNICAL.md).
gguf = ["llama-cpp-python>=0.3", "gguf>=0.17"]
# General-capability regression via lm-eval-harness.
eval = ["lm-eval>=0.4.9"]
# Optional MLflow run + registry logging.
tracking = ["mlflow>=3.0"]
pdf = ["pypdf>=5.0"]

[project.scripts]
factory = "expert_factory.cli:app"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/expert_factory"]

[tool.hatch.build.targets.wheel.force-include]
"prompts" = "expert_factory/_data/prompts"
"configs" = "expert_factory/_data/configs"
"reports/templates" = "expert_factory/_data/reports/templates"

[tool.uv]
conflicts = [
    [{ extra = "awq" }, { extra = "eval" }],
]

[tool.dagster]
module_name = "expert_factory.pipeline.definitions"
code_location_name = "domain_expert_factory"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: end-to-end runs that take more than a few seconds",
    "hf: needs the `train` extra (torch, transformers, peft, trl)",
]
filterwarnings = ["ignore::DeprecationWarning:dagster.*"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N"]
ignore = ["RUF001", "RUF002", "RUF003", "SIM905"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802", "N806"]
"src/expert_factory/students/tinylm.py" = ["N802", "N803", "N806"]
"src/expert_factory/students/hf.py" = ["N806"]

[tool.mypy]
python_version = "3.12"
files = ["src/expert_factory"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["expert_factory.students.hf", "expert_factory.pipeline.definitions"]
disallow_untyped_defs = false
