# Teacher spend configuration.
# Prices are USD per million tokens, Anthropic first-party list prices (cached 2026-09-25).
# cache_write is the 5-minute TTL rate (1.25x input). Update when prices change.

default_budget_usd: 300

# Used to estimate "teacher cost per 1k answers" when the run used the offline teacher.
reference_teacher_model: claude-opus-5-5

prices_per_mtok:
  claude-fable-5-1: { input: 10.0, output: 50.0, cache_write: 12.5, cache_read: 0.25 }
  claude-opus-5-5: { input: 4.0, output: 20.0, cache_write: 5.0, cache_read: 0.20 }
  claude-opus-5: { input: 5.0, output: 25.0, cache_write: 6.25, cache_read: 0.50 }
  claude-sonnet-5-5: { input: 2.0, output: 10.0, cache_write: 2.5, cache_read: 0.20 }
  claude-haiku-4-5: { input: 1.0, output: 5.0, cache_write: 1.25, cache_read: 0.10 }
  offline: { input: 0.0, output: 0.0, cache_write: 0.0, cache_read: 0.0 }

# Per-call token assumptions used for the up-front budget estimate shown for approval.
estimate:
  generate_input_tokens: 1400
  generate_output_tokens: 900
  answer_input_tokens: 900
  answer_output_tokens: 400
  judge_input_tokens: 700
  judge_output_tokens: 300
